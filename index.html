<script>
        let turnosCargados = [];
        let resultadosGlobales = [];
        let nombrePeriodoActual = "";

        document.addEventListener("DOMContentLoaded", () => { actualizarSelectPeriodos(); });

        function esFestivoColombia(date) {
            const y = date.getFullYear();
            const m = date.getMonth() + 1;
            const d = date.getDate();
            const fijos = [`${y}-1-1`, `${y}-5-1`, `${y}-7-20`, `${y}-8-7`, `${y}-12-8`, `${y}-12-25`];
            const dateStr = `${y}-${m}-${d}`;
            if (fijos.includes(dateStr)) return true;

            function getLunesFestivo(ano, mes, diaOriginal) {
                let dt = new Date(ano, mes - 1, diaOriginal);
                let day = dt.getDay();
                let diff = day === 0 ? 1 : (8 - day) % 7;
                dt.setDate(dt.getDate() + diff);
                return `${dt.getFullYear()}-${dt.getMonth()+1}-${dt.getDate()}`;
            }

            const moviles = [
                getLunesFestivo(y, 1, 6), getLunesFestivo(y, 3, 19), getLunesFestivo(y, 6, 29),
                getLunesFestivo(y, 8, 15), getLunesFestivo(y, 10, 12), getLunesFestivo(y, 11, 1), getLunesFestivo(y, 11, 11)
            ];
            return moviles.includes(dateStr) || (date.getDay() === 0);
        }

        document.getElementById('fileExcel').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            nombrePeriodoActual = file.name.replace(/\.[^/.]+$/, "");
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    let turnos = [];

                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(sheet, {header: 1});

                    // Leer desde la fila 1 (encabezados en fila 0)
                    for (let i = 1; i < json.length; i++) {
                        let row = json[i];
                        if (!row || !row[0]) continue;

                        // Estructura limpia: Col 1 = F.Entrada, Col 2 = H.Entrada, Col 3 = F.Salida, Col 4 = H.Salida
                        // (Si hay más turnos en el mismo día, continúan en las columnas 5, 6, 7, 8...)
                        for (let c = 1; c < row.length; c += 4) {
                            let fEnt = row[c], hEnt = row[c+1];
                            let fSal = row[c+2], hSal = row[c+3];

                            if (fEnt !== undefined && hEnt !== undefined && fSal !== undefined && hSal !== undefined) {
                                if (fEnt === '' || hEnt === '' || fSal === '' || hSal === '') continue;
                                let numHEnt = parseFloat(hEnt);
                                let numHSal = parseFloat(hSal);

                                if (!isNaN(numHEnt) && !isNaN(numHSal)) {
                                    let dEnt = typeof fEnt === 'number' ? new Date(Math.round((fEnt - (25567 + 2)) * 86400 * 1000)) : new Date(fEnt);
                                    let dSal = typeof fSal === 'number' ? new Date(Math.round((fSal - (25567 + 2)) * 86400 * 1000)) : new Date(fSal);

                                    if (!isNaN(dEnt.getTime()) && !isNaN(dSal.getTime())) {
                                        dEnt.setHours(Math.floor(numHEnt), Math.round((numHEnt % 1) * 60), 0, 0);
                                        dSal.setHours(Math.floor(numHSal), Math.round((numHSal % 1) * 60), 0, 0);

                                        let horas = (dSal - dEnt) / 3600000;
                                        if (horas > 0 && horas <= 24) {
                                            turnos.push({ entrada: dEnt.toISOString(), salida: dSal.toISOString(), horas: horas });
                                        }
                                    }
                                }
                            }
                        }
                    }

                    if (turnos.length > 0) {
                        turnosCargados = turnos;
                        guardarEnMemoriaLocal(nombrePeriodoActual, turnosCargados);
                        procesarLiquidacion();
                    } else {
                        alert("No se pudieron extraer turnos. Verifica que las columnas sigan el formato: Fecha Entrada | Hora Entrada | Fecha Salida | Hora Salida.");
                    }
                } catch(err) {
                    console.error(err);
                    alert("Error al procesar el archivo Excel.");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function guardarEnMemoriaLocal(nombre, turnos) {
            let guardados = JSON.parse(localStorage.getItem('periodos_nomina') || '{}');
            guardados[nombre] = turnos;
            localStorage.setItem('periodos_nomina', JSON.stringify(guardados));
            actualizarSelectPeriodos();
        }

        function actualizarSelectPeriodos() {
            let select = document.getElementById('selPeriodosGuardados');
            if (!select) return;
            select.innerHTML = '<option value="">-- Selecciona un periodo guardado --</option>';
            let guardados = JSON.parse(localStorage.getItem('periodos_nomina') || '{}');
            Object.keys(guardados).forEach(nombre => {
                let opt = document.createElement('option');
                opt.value = nombre;
                opt.innerText = nombre;
                select.appendChild(opt);
            });
        }

        function cargarPeriodoGuardado() {
            let nombre = document.getElementById('selPeriodosGuardados').value;
            if (!nombre) { alert("Selecciona un periodo."); return; }
            let guardados = JSON.parse(localStorage.getItem('periodos_nomina') || '{}');
            if (guardados[nombre]) {
                nombrePeriodoActual = nombre;
                turnosCargados = guardados[nombre].map(t => ({ entrada: new Date(t.entrada), salida: new Date(t.salida), horas: t.horas }));
                procesarLiquidacion();
            }
        }

        function borrarPeriodoActual() {
            let nombre = document.getElementById('selPeriodosGuardados').value;
            if (!nombre) { alert("Selecciona un periodo."); return; }
            if (confirm(`¿Eliminar '${nombre}'?`)) {
                let guardados = JSON.parse(localStorage.getItem('periodos_nomina') || '{}');
                delete guardados[nombre];
                localStorage.setItem('periodos_nomina', JSON.stringify(guardados));
                actualizarSelectPeriodos();
                document.getElementById('resultsContainer').classList.add('hidden');
            }
        }

        function getWeekKey(date) {
            let d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            let dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            let yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return `${d.getUTCFullYear()}-W${Math.ceil((((d - yearStart) / 86400000) + 1) / 7)}`;
        }

        function recalcular() { if (turnosCargados.length > 0) procesarLiquidacion(); }

        function procesarLiquidacion() {
            const salario = parseFloat(document.getElementById('txtSalario').value) || 4570000;
            const divisor = parseFloat(document.getElementById('selDivisor').value) || 182;
            const valHr = salario / divisor;

            document.getElementById('lblValorHora').innerText = `$ ${valHr.toLocaleString('es-CO', {minimumFractionDigits: 2, maximumFractionDigits: 2})} COP`;
            document.getElementById('badgePeriodo').innerText = `Periodo: ${nombrePeriodoActual}`;

            let turnosOrdenados = turnosCargados.map(t => ({
                entrada: new Date(t.entrada), salida: new Date(t.salida), horas: t.horas
            })).sort((a, b) => a.entrada - b.entrada);

            let acumuladorSemanal = {};
            let resultados = [];

            turnosOrdenados.forEach(t => {
                let current = new Date(t.entrada);
                let fin = new Date(t.salida);
                let hTotal = t.horas;

                let tHED = 0, tHEN = 0, tHEDF = 0, tHENF = 0;
                let tRN = 0, tRNF = 0, tHDF = 0, tOrdDiurna = 0;

                while (current < fin) {
                    let next = new Date(current);
                    next.setHours(next.getHours() + 1);
                    if (next > fin) next = new Date(fin);
                    let segDur = (next - current) / 3600000;

                    let weekKey = getWeekKey(current);
                    if (!acumuladorSemanal[weekKey]) acumuladorSemanal[weekKey] = 0;

                    let isExtra = acumuladorSemanal[weekKey] >= 42.0;
                    acumuladorSemanal[weekKey] += segDur;

                    let isFd = esFestivoColombia(current);
                    let hour = current.getHours();
                    let isNight = (hour >= 19 || hour < 6);

                    if (!isExtra) {
                        if (!isFd) {
                            if (isNight) tRN += segDur;
                            else tOrdDiurna += segDur;
                        } else {
                            if (isNight) tRNF += segDur;
                            else tHDF += segDur;
                        }
                    } else {
                        if (!isFd) {
                            if (isNight) tHEN += segDur;
                            else tHED += segDur;
                        } else {
                            if (isNight) tHENF += segDur;
                            else tHEDF += segDur;
                        }
                    }
                    current = next;
                }

                let subtotal = (tOrdDiurna * valHr) + (tHED * valHr * 1.25) + (tHEN * valHr * 1.75) +
                               (tHEDF * valHr * 2.0) + (tHENF * valHr * 2.5) + (tRN * valHr * 0.35) +
                               (tRNF * valHr * 1.35) + (tHDF * valHr * 0.75);

                resultados.push({
                    entrada: t.entrada.toLocaleString(),
                    salida: t.salida.toLocaleString(),
                    tipoDia: esFestivoColombia(t.entrada) ? "Domingo/Festivo" : "Día Hábil",
                    totalHoras: hTotal.toFixed(2),
                    hed: tHED.toFixed(2),
                    hen: tHEN.toFixed(2),
                    hedf: tHEDF.toFixed(2),
                    henf: tHENF.toFixed(2),
                    rn: tRN.toFixed(2),
                    rnf: tRNF.toFixed(2),
                    hdf: tHDF.toFixed(2),
                    subtotal: subtotal
                });
            });

            resultadosGlobales = resultados;
            renderizarResultados();
        }

        function renderizarResultados() {
            let totH = 0, totHED = 0, totHEN = 0, totHEDF = 0, totHENF = 0, totRN = 0, totRNF = 0, totHDF = 0, totDinero = 0;
            let tbody = document.getElementById('tableBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            resultadosGlobales.forEach(r => {
                totH += parseFloat(r.totalHoras);
                totHED += parseFloat(r.hed);
                totHEN += parseFloat(r.hen);
                totHEDF += parseFloat(r.hedf);
                totHENF += parseFloat(r.henf);
                totRN += parseFloat(r.rn);
                totRNF += parseFloat(r.rnf);
                totHDF += parseFloat(r.hdf);
                totDinero += r.subtotal;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 border-b">
                        <td class="p-3">${r.entrada}</td>
                        <td class="p-3">${r.salida}</td>
                        <td class="p-3 font-semibold text-indigo-600">${r.tipoDia}</td>
                        <td class="p-3 text-center font-bold">${r.totalHoras}</td>
                        <td class="p-3 text-center">${r.hed}</td>
                        <td class="p-3 text-center">${r.hen}</td>
                        <td class="p-3 text-center">${r.hedf}</td>
                        <td class="p-3 text-center">${r.henf}</td>
                        <td class="p-3 text-center">${r.rn}</td>
                        <td class="p-3 text-center">${r.rnf}</td>
                        <td class="p-3 text-center">${r.hdf}</td>
                        <td class="p-3 text-right font-bold text-emerald-600">$ ${r.subtotal.toLocaleString('es-CO', {maximumFractionDigits: 0})}</td>
                    </tr>
                `;
            });

            document.getElementById('metricTotalHoras').innerText = `${totH.toFixed(2)} h`;
            document.getElementById('metricHED').innerText = `${totHED.toFixed(2)} h`;
            document.getElementById('metricHEN').innerText = `${totHEN.toFixed(2)} h`;
            document.getElementById('metricHEDF').innerText = `${totHEDF.toFixed(2)} h`;
            document.getElementById('metricHENF').innerText = `${totHENF.toFixed(2)} h`;
            document.getElementById('metricRN').innerText = `${totRN.toFixed(2)} h`;
            document.getElementById('metricRNF').innerText = `${totRNF.toFixed(2)} h`;
            document.getElementById('metricHDF').innerText = `${totHDF.toFixed(2)} h`;
            document.getElementById('metricDevengado').innerText = `$ ${totDinero.toLocaleString('es-CO', {maximumFractionDigits: 0})} COP`;

            document.getElementById('resultsContainer').classList.remove('hidden');
        }

        function exportarCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Entrada,Salida,Tipo Día,Total Horas,HED,HEN,HEDF,HENF,RN,RNF,HDF,Subtotal\n";
            resultadosGlobales.forEach(r => {
                csvContent += `"${r.entrada}","${r.salida}","${r.tipoDia}",${r.totalHoras},${r.hed},${r.hen},${r.hedf},${r.henf},${r.rn},${r.rnf},${r.hdf},${r.subtotal}\n`;
            });
            let encodedUri = encodeURI(csvContent);
            let link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `consolidado_${nombrePeriodoActual}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
